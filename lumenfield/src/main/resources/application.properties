spring.application.name=lumenfield
server.port=8791

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lumenfield?serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:bankuser}
spring.datasource.password=${DB_PASSWORD:meridian_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
